# Cloudflare Worker for SVWB Analyzer's cross-device sync.
# See README.md in this directory for the deploy steps, and docs/sync-protocol.md
# for the HTTP contract this implements.
#
# A separate Worker, database and (eventually) domain from server/telemetry on
# purpose: telemetry's claim is "no account, cannot be traced to a person", and
# that sentence stops being checkable by eye the moment an account table shares
# its database.
name = "sync"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[observability]
enabled = true

# The nightly job (`scheduled` in src/index.ts): retire devices idle for 90 days
# (fold their log into one snapshot), and prune expired grants and old counters.
# Same off-the-hour minute as the telemetry Worker, for the same reason.
[triggers]
crons = ["17 4 * * *"]

# Policy knobs. Plain vars, so changing one is a dashboard edit or a redeploy,
# never an app release - the whole reason these live on the server (J-2).
[vars]
# Per-account storage ceiling, bytes. Over it, a push gets 413 `quota`.
QUOTA_BYTES = "104857600"
# Sync rounds (GET /v1/segments) per account per UTC day. Over it: 429.
ROUNDS_PER_DAY = "200"
# Hard cap on active devices per account. 0 = no cap (the default; J-2 prefers
# limiting cost over counting machines, but keeps this switch for abuse).
MAX_DEVICES = "0"
# "1" makes everything except /auth/*, /v1/auth/* and /health answer 503 +
# Retry-After. The client backs off silently and the app carries on.
KILL_SWITCH = "0"

[[d1_databases]]
binding = "DB"
database_name = "svwb-sync"
# PLACEHOLDER - replace with the id printed by `wrangler d1 create svwb-sync
# --location apac`. A deploy with this value fails loudly, which is the point.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# The log segments. Create the bucket with `--location apac` (README): the
# location hint is fixed at creation, and the privacy policy states the region
# (J-5). Nothing in this file can set it.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "svwb-sync"

# Secrets, NOT in this file (`wrangler secret put <NAME>`):
#   GOOGLE_CLIENT_ID      OAuth "Web application" client id
#   GOOGLE_CLIENT_SECRET  its secret - the reason the code exchange is on the server
#   SESSION_SECRET        >= 32 random bytes; signs access JWTs and the OAuth state

# Rate limiting, same shape as server/telemetry. The bindings are read as
# OPTIONAL in src/index.ts and fail open: a renamed binding must not turn into
# every user's sync going dark. `period` accepts only 10 or 60; namespace ids
# are local to this Worker and must be distinct.

# Every request, per IP. Generous: a NAT'd household shares one.
[[unsafe.bindings]]
name = "IP_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 120, period = 60 }

# /auth/* and /v1/auth/*, per IP. Tight: this is where tokens get guessed and
# where each request costs a D1 write or a call to Google.
[[unsafe.bindings]]
name = "AUTH_IP_LIMITER"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 20, period = 60 }

# Authenticated requests, per account (keyed on the token's `sub`). A sync round
# is a handful of requests, so this bounds a runaway client without touching a
# real one. The per-DAY ceiling is ROUNDS_PER_DAY, enforced in D1.
[[unsafe.bindings]]
name = "ACCOUNT_LIMITER"
type = "ratelimit"
namespace_id = "2003"
simple = { limit = 60, period = 60 }
