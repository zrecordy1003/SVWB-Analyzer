# Same two jobs as server/telemetry/pnpm-workspace.yaml - read the comment there
# for the CI failure that taught them.
#
# 1. Pins THIS directory as its own pnpm root, so an install here does not walk
#    up and install the app's workspace instead. `server/sync` is a standalone
#    project with its own package.json: a push to the app must never install
#    wrangler and workerd.
# 2. Carries `allowBuilds` (what pnpm 11 reads; pnpm 10 honours it too) for
#    wrangler's own binaries. Do not "fix" (1) with `--ignore-workspace`: that
#    flag makes pnpm skip this file and silently undoes (2).
allowBuilds:
  esbuild: true
  workerd: true
