<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <!--
      Dark, and only dark. The app's own theme is `mode: 'dark'` outright, so a
      splash that followed the OS would be the one light surface in the product
      - and on a light desktop it used to render near-black text over whatever
      the window happened to be sitting on.
    -->
    <meta name="color-scheme" content="dark" />
    <title>SVWB Analyzer</title>
    <style>
      :root {
        --surface: #0f1216;
        --surface-top: #161b22;
        --border: rgba(255, 255, 255, 0.1);
        --text: rgba(255, 255, 255, 0.94);
        --muted: rgba(255, 255, 255, 0.62);
        --ring-from: #60a5fa;
        --ring-to: #a78bfa;
        --radius: 16px;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        /*
          Solid. The window is opaque (see `createSplash`), so this is the
          surface the text actually sits on - no compositing with the desktop,
          and nothing that depends on `backdrop-filter` having something to
          work with.
        */
        background: var(--surface);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Noto Sans TC',
          'Helvetica Neue',
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        letter-spacing: 0.2px;
        overflow: hidden;
      }

      /* Character, not contrast: it sits under the text but never carries it. */
      .backdrop {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(760px 380px at 18% 8%, rgba(99, 102, 241, 0.18), transparent 62%),
          radial-gradient(620px 340px at 88% 94%, rgba(56, 189, 248, 0.14), transparent 58%),
          linear-gradient(180deg, var(--surface-top), var(--surface) 55%);
      }

      /*
        The window *is* the card. It used to be a 300px panel floating inside a
        360x420 window, which was invisible while the window was transparent -
        the moment it became opaque, that leftover margin showed up as a band of
        dead surface above and below. Nothing floats now; the frameless window's
        own rounded corners are the card's edge.
      */
      .card {
        position: relative;
        width: 100%;
        box-sizing: border-box;
        padding: 26px 30px;
      }

      .logo-wrap {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        margin: 6px auto 14px;
        position: relative;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
      }
      .logo-ring {
        position: absolute;
        inset: -8px;
        border-radius: 24px;
        background: conic-gradient(from 0deg, var(--ring-from), var(--ring-to), var(--ring-from));
        filter: blur(14px);
        opacity: 0.4;
        z-index: -1;
        animation: spin 4.5s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .logo svg {
        width: 40px;
        height: 40px;
        display: block;
      }

      .title {
        text-align: center;
        font-weight: 700;
        font-size: 18px;
        color: var(--text);
        margin-top: 6px;
      }
      .subtitle {
        text-align: center;
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 4px;
      }

      .bar {
        position: relative;
        height: 8px;
        margin: 18px 2px 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .bar > i {
        position: absolute;
        inset: 0;
        width: 38%;
        background: linear-gradient(90deg, var(--ring-from), var(--ring-to));
        border-radius: 999px;
        animation: slide 1.6s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          left: -40%;
        }
        50% {
          left: 40%;
        }
        100% {
          left: 100%;
        }
      }

      .status {
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>

    <div class="card" role="status" aria-live="polite">
      <div class="logo-wrap">
        <div class="logo-ring"></div>
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#60a5fa" />
                <stop offset="1" stop-color="#a78bfa" />
              </linearGradient>
            </defs>
            <path d="M12 3l7 4v10l-7 4-7-4V7l7-4Z" stroke="url(#g)" stroke-width="1.5" />
            <path d="M12 7l4 2.3v5.4L12 17l-4-2.3V9.3L12 7Z" fill="url(#g)" opacity=".35" />
          </svg>
        </div>
      </div>

      <div class="title">SVWB Analyzer</div>
      <div class="subtitle">正在準備本機資料與對戰辨識功能</div>

      <div class="bar"><i></i></div>
      <div id="status" class="status">正在啟動應用程式，請稍候…</div>
    </div>
  </body>
</html>
