<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>SVWB Analyzer</title>
    <style>
      :root {
        --bg: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.22);
        --text: rgba(17, 24, 39, 0.92);
        --muted: rgba(17, 24, 39, 0.65);
        --ring-from: #7dd3fc; /* sky-300 */
        --ring-to: #a78bfa; /* violet-400 */
        --accent: #60a5fa; /* blue-400 */
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        --radius: 20px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: rgba(17, 25, 40, 0.55);
          --border: rgba(255, 255, 255, 0.14);
          --text: rgba(255, 255, 255, 0.92);
          --muted: rgba(255, 255, 255, 0.65);
          --ring-from: #60a5fa;
          --ring-to: #a78bfa;
          --accent: #93c5fd;
          --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
      }
      body {
        display: grid;
        place-items: center;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Noto Sans TC',
          'Helvetica Neue',
          Arial,
          'Apple Color Emoji',
          'Segoe UI Emoji';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        letter-spacing: 0.2px;
      }

      .backdrop {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(1200px 600px at 20% 10%, rgba(99, 102, 241, 0.25), transparent 60%),
          radial-gradient(900px 500px at 85% 90%, rgba(56, 189, 248, 0.22), transparent 55%);
        mask-image: radial-gradient(
          closest-side,
          rgba(0, 0, 0, 0.85),
          rgba(0, 0, 0, 0.65),
          transparent 85%
        );
      }

      .noise {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.08;
        mix-blend-mode: overlay;
        background-image: url('data:image/svg+xml;utf8,\<svg xmlns="http://www.w3.org/2000/svg" width=\"160\" height=\"160\" viewBox=\"0 0 160 160\">\<filter id=\"n\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.9\" numOctaves=\"4\" stitchTiles=\"stitch\"/></filter>\<rect width=\"100%\" height=\"100%\" filter=\"url(#n)\" opacity=\"0.55\"/>\</svg>');
        background-size: 200px 200px;
      }

      .card {
        position: relative;
        width: 300px;
        padding: 24px 22px;
        border-radius: var(--radius);
        background: var(--bg);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);
      }

      .logo-wrap {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        margin: 6px auto 14px;
        position: relative;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
        border: 1px solid var(--border);
      }
      .logo-ring {
        position: absolute;
        inset: -8px;
        border-radius: 24px;
        background: conic-gradient(from 0deg, var(--ring-from), var(--ring-to), var(--ring-from));
        filter: blur(14px);
        opacity: 0.45;
        z-index: -1;
        animation: spin 4.5s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* inline logo */
      .logo svg {
        width: 40px;
        height: 40px;
        display: block;
      }

      .title {
        text-align: center;
        font-weight: 700;
        font-size: 18px;
        color: var(--text);
        margin-top: 6px;
      }
      .subtitle {
        text-align: center;
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 4px;
      }

      .bar {
        position: relative;
        height: 8px;
        margin: 18px 2px 6px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.06));
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .bar > i {
        position: absolute;
        inset: 0;
        width: 38%;
        background: linear-gradient(90deg, var(--ring-from), var(--ring-to));
        filter: saturate(1.1);
        border-radius: 999px;
        animation: slide 1.6s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          left: -40%;
        }
        50% {
          left: 40%;
        }
        100% {
          left: 100%;
        }
      }

      .status {
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        min-height: 1.2em;
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 14px;
        opacity: 0.9;
      }
      .chip {
        font-size: 10.5px;
        padding: 4px 8px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>
    <div class="noise"></div>

    <div class="card" role="status" aria-live="polite">
      <div class="logo-wrap">
        <div class="logo-ring"></div>
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#60a5fa" />
                <stop offset="1" stop-color="#a78bfa" />
              </linearGradient>
            </defs>
            <path d="M12 3l7 4v10l-7 4-7-4V7l7-4Z" stroke="url(#g)" stroke-width="1.5" />
            <path d="M12 7l4 2.3v5.4L12 17l-4-2.3V9.3L12 7Z" fill="url(#g)" opacity=".35" />
          </svg>
        </div>
      </div>

      <div class="title">SVWB Analyzer</div>
      <div class="subtitle">Initializing… please wait</div>

      <div class="bar"><i></i></div>
      <div id="status" class="status">Starting services</div>

      <!-- <div class="foot">
        <span class="chip">OpenCV ready</span>
        <span class="chip">Local DB</span>
        <span class="chip">Secure IPC</span>
      </div> -->
    </div>

</html>
