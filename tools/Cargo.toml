# Workspace over the three Rust crates.
#
# Before this, each crate was its own workspace root, so each had a private
# `target/` (795MB combined) and the `image` crate was compiled twice - once for
# `vision-native` and again for `vision-node-addon`, which depends on it by path.
# One workspace shares a single `target/` and a single lockfile.
[workspace]
resolver = "3"
members = ["capture", "engine", "vision-native", "vision-node-addon"]

# Profiles MUST live here. Cargo ignores `[profile.*]` in a workspace member and
# only warns, so leaving these in the member manifests would silently drop LTO
# and the single codegen unit from the shipped binaries.
[profile.release]
lto = true
codegen-units = 1
strip = true

# `cargo test --release` inherited the settings above, which meant a fat-LTO
# link for each of the ~16 test and bin executables the workspace produces -
# 21s locally for `--no-run`, against 9s without it. The shipped binaries still
# want fat LTO, so the tests get their own profile instead of the release one
# being weakened.
#
# Nothing consumes what this profile builds: everything that runs the engine
# (src/main, the parity check, build.win.extraResources) reads
# `target/release/svwb-engine.exe`, which `engine:build` produces - and
# `vision:verify` runs `engine:build` before the checks that need it. The cost
# is a third artifact set in `target/`, so the first CI run after this lands is
# slower, not faster.
[profile.release-test]
inherits = "release"
lto = false
codegen-units = 16
strip = false
