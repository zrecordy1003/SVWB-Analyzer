name: CI

# The Rust checks and the fixture-backed vision checks need a compiled
# `svwb-vision.node`, so this workflow builds the addon before running them.
# That is the whole point: `pnpm vision:verify` is where the recognition
# regressions get caught, and it is worthless if it only ever runs locally.
#
# Three jobs, not one. Everything in `typescript` was measured at ~52s and needs
# no Rust toolchain, no cargo cache and no LFS object, so running it after the
# Rust work put it on the critical path for nothing. The jobs share no state
# deliberately: `pnpm test` needs the engine binary, so it stays with Rust
# rather than being handed an artifact.
#
# `e2e` is the third. It launches the real Electron app, so unlike `typescript`
# it has to run the install scripts that fetch the Electron binary, and unlike
# `rust` it needs no toolchain - which is why it is its own job rather than a
# step bolted onto either.

on:
  push:
    branches: [main, master, for_dev]
  pull_request:
  workflow_dispatch:

jobs:
  typescript:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # No `lfs: true` here, unlike the rust job: eng.traineddata.gz is only
      # read by vision:verify's OCR oracle. Skipping it keeps this job off the
      # LFS bandwidth quota entirely.
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `electron-builder install-app-deps` runs on postinstall and pulls the
      # Electron binary. Nothing here launches Electron, so skip that download.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build renderer and main bundles
        run: pnpm exec electron-vite build

  rust:
    # Windows because the addon is built and consumed on Windows, and the
    # capture pipeline is Windows-only. Matching the target platform here keeps
    # a green CI meaningful.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # `lfs: true` is required, not cosmetic: eng.traineddata.gz is the one
      # LFS-tracked file left, and without it the checkout gets a 132-byte
      # pointer. tesseract.js then fails with a bare "initialization failed"
      # inside vision:verify's OCR oracle. 2.9MB per run against the LFS
      # bandwidth quota.
      - uses: actions/checkout@v4
        with:
          lfs: true

      # `tests/main/dbUpgrade.test.ts` reads the PREVIOUS release's migrations
      # straight out of git (`git show v1.2.0:resources/migrations/...`) so the
      # upgrade path it exercises cannot drift from what actually shipped.
      # actions/checkout fetches a single commit and no tags, so that test
      # failed here with `fatal: Not a valid object name v1.2.0` while passing
      # locally, where the tags exist.
      #
      # A shallow fetch of the tags only - not `fetch-depth: 0`. Each tag
      # brings its own commit and that commit's trees, which is all `ls-tree`
      # and `show` need, without the rest of the history.
      #
      # Deliberately NOT solved by having the test skip when the tag is
      # missing: an invisible skip in CI is how a gate stops being one.
      - name: Fetch the release tags
        run: git fetch --depth=1 origin "+refs/tags/*:refs/tags/*"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # One Cargo workspace over all three crates, so a single cache key.
          workspaces: tools
          # Bump this string to force the cache to be rewritten. rust-cache
          # keys on Cargo.lock and the toolchain, and `save.ts` returns early
          # on `isCacheUpToDate()` - so an exact key match saves nothing, and a
          # change that adds a profile without touching Cargo.lock can never
          # get that profile's dependencies into the cache. That is what
          # happened when release-test was introduced: its dependencies were
          # recompiled from scratch on every run. Measured locally,
          # `cargo test --profile release-test --no-run` costs 32s with those
          # dependencies cold and 4s with them cached.
          key: profiles-release-test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The database-backed tests bring a scratch DB up through
      # `svwb-engine migrate` - the single owner of migrations, so the suite
      # exercises the same path the app does (tests/helpers/db.ts). That needs
      # the binary to exist before `pnpm test`, not just before vision:verify.
      #
      # This step costs ~53s even on a full cache hit, and that is expected:
      # rust-cache restores the dependency artifacts but deletes this
      # workspace's own crates before saving, so all four are always rebuilt.
      # With `lto = true` and `codegen-units = 1` (tools/Cargo.toml) the link
      # is the bulk of it. Do not "fix" this by widening the cache - the
      # artifacts it would need to keep are the ones rust-cache prunes on
      # purpose.
      - name: Build the engine
        run: pnpm engine:build

      - name: Unit and IPC tests
        run: pnpm test

      - name: Build the vision addon
        run: pnpm vision:build

      # Rust unit tests, clippy, and the fixture-backed recognition checks.
      - name: Verify recognition
        run: pnpm vision:verify

      # Replays a real recording frame by frame. This is the only check that
      # exercises the parts of recognition that exist over time rather than in a
      # single still - that the play-order overlay is still on screen at a
      # sampled tick, that the final result banner overwrites the provisional
      # one.
      #
      # The source recordings are tens of megabytes each and are gitignored
      # (see .gitignore), so on a clean checkout this fixture is absent and the
      # step reports a skip. `svwb-engine` only ever exits 0 or 1, so the skip
      # is decided by looking for the file rather than by reading an exit code.
      # Commit the recordings (LFS) to turn this into a real CI gate.
      - name: Replay the CPU practice recording
        shell: bash
        run: |
          recording=tests/fixtures/captures/cpu-practice-1920-fullscreen/recording.mp4
          if [ ! -f "$recording" ]; then
            echo "::warning::$recording is not in the checkout, replay check skipped"
            exit 0
          fi
          pnpm engine:replay-cpu

  # The end-to-end suite, driving the real app through Playwright's Electron
  # driver. It was local-only until now, which made it the same kind of gap the
  # replay check has: 865 lines that looked like a gate and never ran on a push.
  #
  # The host layer is exactly what it covers - window creation, the preload
  # bridge, the protocol handler, the update flow, the deck-versioning rules
  # read back through the real IPC - and that is the half of this repo `cargo
  # test` cannot reach.
  e2e:
    # Pinned, unlike the other two jobs, and the reason is the install below.
    #
    # This is the only job that runs the postinstall scripts, so it is the only
    # one that rebuilds the native modules - and `windows-latest` now ships
    # Visual Studio 18, which node-gyp 9.4.1 (pulled in by
    # `extract-file-icon`'s install script) does not recognise:
    #
    #   gyp ERR! find VS unknown version "undefined" found at
    #     "C:\Program Files\Microsoft Visual Studio\18\Enterprise"
    #   gyp ERR! find VS could not find a version of Visual Studio 2017 or newer
    #
    # windows-2022 carries VS 17, which it does recognise. That also matches
    # the toolchain the release build is actually made with, so a green e2e
    # here says something about the artifact the user ships.
    #
    # Revisit when this image is retired: the durable fix is a node-gyp new
    # enough to know VS 18, which means moving off `extract-file-icon` or
    # overriding its build dependency.
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # No `--ignore-scripts` here, unlike the other two jobs: this is the one
      # that actually launches Electron, so `electron-builder install-app-deps`
      # has to run and fetch the binary.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The database-backed startup path runs `svwb-engine migrate` before
      # anything reads, so the app cannot boot without the binary. Built here
      # rather than taken from the `rust` job to keep the two independent - the
      # same trade the comment at the top of this file describes.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools
          key: e2e

      - name: Build the engine
        run: pnpm engine:build

      # `playwright test` builds the bundles itself: the build is a `setup`
      # project the `e2e` project depends on (see playwright.config.ts), so
      # there is no separate build step to keep in sync with it.
      #
      # `--grep-invert @network` drops the two class-emblem tests that download
      # from Cygames. They are real tests, not stubs, and they stay in the local
      # run - but a push should not hit a third party's CDN, and a green CI
      # should not appear to cover something whose result depended on that CDN
      # being up. See tests/e2e/classIcons.spec.ts.
      - name: End-to-end
        run: pnpm test:e2e:ci

      # The trace and the main-process log are attached to failing tests by the
      # `app` fixture. Without this upload they would exist only inside the
      # runner.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
