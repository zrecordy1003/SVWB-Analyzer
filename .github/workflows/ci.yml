name: CI

# The Rust checks and the fixture-backed vision checks need a compiled
# `svwb-vision.node`, so this workflow builds the addon before running them.
# That is the whole point: `pnpm vision:verify` is where the recognition
# regressions get caught, and it is worthless if it only ever runs locally.

on:
  push:
    branches: [main, master, for_dev]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    # Windows because the addon is built and consumed on Windows, and the
    # capture pipeline is Windows-only. Matching the target platform here keeps
    # a green CI meaningful.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # `lfs: true` is required, not cosmetic: eng.traineddata.gz is the one
      # LFS-tracked file left, and without it the checkout gets a 132-byte
      # pointer. tesseract.js then fails with a bare "initialization failed"
      # inside vision:verify's OCR oracle. 2.9MB per run against the LFS
      # bandwidth quota.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # One Cargo workspace over all three crates, so a single cache key.
          workspaces: tools

      # `electron-builder install-app-deps` runs on postinstall and pulls the
      # Electron binary. Nothing here launches Electron, so skip that download.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The database-backed tests bring a scratch DB up through
      # `svwb-engine migrate` - the single owner of migrations, so the suite
      # exercises the same path the app does (tests/helpers/db.ts). That needs
      # the binary to exist before `pnpm test`, not just before vision:verify.
      #
      # This step costs ~53s even on a full cache hit, and that is expected:
      # rust-cache restores the dependency artifacts but deletes this
      # workspace's own crates before saving, so all four are always rebuilt.
      # With `lto = true` and `codegen-units = 1` (tools/Cargo.toml) the link
      # is the bulk of it. Do not "fix" this by widening the cache - the
      # artifacts it would need to keep are the ones rust-cache prunes on
      # purpose.
      - name: Build the engine
        run: pnpm engine:build

      - name: Unit and IPC tests
        run: pnpm test

      - name: Build the vision addon
        run: pnpm vision:build

      # Rust unit tests, clippy, and the fixture-backed recognition checks.
      - name: Verify recognition
        run: pnpm vision:verify

      # Replays a real recording frame by frame. This is the only check that
      # exercises the parts of recognition that exist over time rather than in a
      # single still - that the play-order overlay is still on screen at a
      # sampled tick, that the final result banner overwrites the provisional
      # one.
      #
      # The source recordings are tens of megabytes each and are gitignored
      # (see .gitignore), so on a clean checkout this fixture is absent and the
      # step reports a skip. `svwb-engine` only ever exits 0 or 1, so the skip
      # is decided by looking for the file rather than by reading an exit code.
      # Commit the recordings (LFS) to turn this into a real CI gate.
      - name: Replay the CPU practice recording
        shell: bash
        run: |
          recording=tests/fixtures/captures/cpu-practice-1920-fullscreen/recording.mp4
          if [ ! -f "$recording" ]; then
            echo "::warning::$recording is not in the checkout, replay check skipped"
            exit 0
          fi
          pnpm engine:replay-cpu

      - name: Build renderer and main bundles
        run: pnpm exec electron-vite build
